<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA PRO - Batalha (Cyber Pitch)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "surface": "#131315",
                "on-surface": "#e5e1e4",
                "primary": "#ffd700",
                "on-primary": "#3a3000",
                "surface-container": "#201f21",
                "surface-bright": "#39393b",
                "surface-dim": "#131315",
                "outline": "#999077",
                "error": "#ffb4ab"
            },
            "borderRadius": {
                "DEFAULT": "1rem",
                "lg": "1.5rem",
                "full": "9999px"
            }
          }
        }
      }
    </script>
    
    <style>
        /* CORREÇÃO DO SCROLL: Agora a página rola na vertical se o conteúdo for longo */
        body { 
            background-color: #000; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }

        /* Cyber Background animado - O hidden fica apenas aqui para o fundo não vazar */
        .cyber-bg { 
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle at center, #131315 0%, #000000 100%); 
            z-index: 0; 
            overflow: hidden;
            pointer-events: none;
        }
        .cyber-bg::before { 
            content: ""; 
            position: absolute; 
            width: 200%; 
            height: 200%; 
            top: -50%; 
            left: -50%; 
            background-image: linear-gradient(rgba(255, 215, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px); 
            background-size: 40px 40px; 
            transform: perspective(500px) rotateX(60deg); 
            animation: moveGrid 20s linear infinite; 
        }
        @keyframes moveGrid { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px); } }

        .glass-card { background: rgba(32, 31, 33, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 215, 0, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .option-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 215, 0, 0.1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .option-btn:hover { background: rgba(255, 215, 0, 0.1); border-color: #ffd700; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2); }
        .option-btn:active { transform: translateY(1px); }
        .gold-glow { box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); }
        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.02); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="text-on-surface font-['Sora'] min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 py-12">

    <div class="cyber-bg"></div>

    <main class="relative z-10 w-full max-w-lg my-auto">
        <div class="flex flex-col items-center mb-12 mt-8">
            <div class="relative mb-6 animate-float" id="player-corner"></div>
            <div class="glass-card px-8 py-4 rounded-full flex items-center gap-8 border-primary/20 w-full justify-center">
                <div class="text-center border-r border-white/10 pr-6">
                    <span class="block text-[10px] uppercase tracking-[0.3em] text-on-surface/50 mb-1">Guerreiro</span>
                    <span class="font-extrabold text-primary tracking-tight text-base sm:text-lg truncate max-w-[120px] block" id="nome-jogador">---</span>
                </div>
                <div class="text-center pl-2">
                    <span class="block text-[10px] uppercase tracking-[0.3em] text-on-surface/50 mb-1">Pontos</span>
                    <span class="font-extrabold text-2xl text-white" id="pontos-ui">0</span>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-lg p-6 sm:p-10 relative overflow-hidden">
            <div class="absolute top-0 left-0 h-1 bg-primary gold-glow transition-all duration-700" id="progress-bar" style="width: 0%"></div>
            
            <div class="flex flex-col items-center text-center py-8" id="tela-bloqueio">
                <div class="w-16 h-16 mb-6 border-4 border-primary/30 border-t-primary rounded-full animate-spin"></div>
                <h2 class="text-2xl font-extrabold text-primary tracking-widest uppercase mb-2">Aguardando Arena</h2>
                <p class="text-on-surface/60 text-sm leading-relaxed max-w-[250px]">O professor iniciará a batalha em breve.</p>
            </div>
            
            <div id="tela-quiz" style="display: none;">
                <p class="text-lg sm:text-xl font-bold mb-8 leading-relaxed text-white tracking-tight" id="txt-pergunta"></p>
                
                <div class="grid grid-cols-1 gap-4" id="btn-options"></div>
                
                <p id="feedback-msg" class="font-bold text-lg h-8 mt-4 text-center"></p>
            </div>
        </div>
        
        <div class="mt-8 text-center opacity-30">
            <span class="text-[10px] uppercase tracking-[0.5em] font-medium">Arena Pro // Battle System v2.0</span>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, getDoc, collection, getDocs, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAtKHigv0ghzwzMilQ1y0NTebpmaI2yE2A",
            authDomain: "yvypoty-491e8.firebaseapp.com",
            projectId: "yvypoty-491e8",
            storageBucket: "yvypoty-491e8.firebasestorage.app",
            messagingSenderId: "338156073833",
            appId: "1:338156073833:web:ca0d8ede1456dad29243f8",
            measurementId: "G-W93E7TJ59V" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const nick = localStorage.getItem("usuarioAtivo");
        const salaPIN = localStorage.getItem("salaPIN");
        const meuSprite = localStorage.getItem("meuHeroi");
        
        if (!nick || !salaPIN || !meuSprite) { window.location.href = "index.html"; }

        // CHUTA O ALUNO SE O PROFESSOR ENCERRAR A AULA
        onSnapshot(doc(db, "salas", salaPIN), (docSnap) => {
            const dados = docSnap.data();
            if (dados && dados.encerrada === true) {
                alert("O professor encerrou esta batalha. Até a próxima!");
                localStorage.clear();
                window.location.href = "index.html";
            }
        });

        document.getElementById('nome-jogador').innerText = nick;
        const corner = document.getElementById('player-corner');
        corner.innerHTML = meuSprite.includes('/') 
            ? `<div class="w-24 h-24 rounded-full border-4 border-primary gold-glow flex items-center justify-center bg-surface-container overflow-hidden"><img src="${meuSprite}" class="w-full h-full object-cover"></div>`
            : `<div class="w-24 h-24 rounded-full border-4 border-primary gold-glow flex items-center justify-center bg-surface-container overflow-hidden text-5xl">${meuSprite}</div>`;
        
        let perguntas = [];
        let pontosAtuais = 0;
        let progressoTotal = 0;

        onSnapshot(doc(db, "salas", salaPIN, "configuracao", "estado"), (docSnap) => {
            const dados = docSnap.data();
            if (dados && dados.jogando === true) {
                document.getElementById('tela-bloqueio').style.display = 'none';
                document.getElementById('tela-quiz').style.display = 'block';
                if(perguntas.length === 0) loadQuestions();
            } else {
                document.getElementById('tela-bloqueio').style.display = 'flex';
                document.getElementById('tela-quiz').style.display = 'none';
            }
        });

        async function loadQuestions() {
            const snap = await getDocs(collection(db, "salas", salaPIN, "perguntas"));
            perguntas = snap.docs.map(d => d.data());
            renderQuestion();
        }

        function renderQuestion() {
            if (perguntas.length === 0) { document.getElementById('txt-pergunta').innerText = "Missões concluídas!"; document.getElementById('btn-options').innerHTML = ""; return; }
            const q = perguntas[Math.floor(Math.random() * perguntas.length)];
            document.getElementById('txt-pergunta').innerText = q.enunciado;
            const container = document.getElementById('btn-options'); container.innerHTML = "";
            
            q.opcoes.forEach((opt, idx) => {
                const btn = document.createElement('button'); 
                btn.className = "option-btn w-full p-4 sm:p-6 rounded-lg text-left font-bold text-on-surface hover:text-primary flex justify-between items-center group";
                // CORREÇÃO: "break-words" garante que o texto quebre linhas e não fuja da tela
                btn.innerHTML = `<span class="break-words w-full pr-4 leading-snug">${opt}</span><span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity shrink-0">arrow_forward</span>`;
                btn.onclick = () => check(idx, q.correta, q.enunciado);
                container.appendChild(btn);
            });
            progressoTotal = (progressoTotal + 10) % 100;
            document.getElementById('progress-bar').style.width = `${progressoTotal}%`;
        }

        async function check(choice, correct, enunciadoAtual) {
            const fb = document.getElementById('feedback-msg');
            const refJogador = doc(db, "salas", salaPIN, "jogadores", nick);
            document.getElementById('btn-options').innerHTML = ""; 
            
            const isCorrect = choice === correct;
            const docSnap = await getDoc(refJogador);
            pontosAtuais = docSnap.exists() ? (docSnap.data().acertos || 0) : 0;

            if (isCorrect) {
                pontosAtuais += 1;
                fb.innerText = "✨ RESPOSTA CORRETA"; fb.style.color = "#ffd700";
            } else {
                pontosAtuais = Math.max(0, pontosAtuais - 1);
                fb.innerText = "❌ FALHA DETECTADA"; fb.style.color = "#ffb4ab";
            }
            
            document.getElementById('pontos-ui').innerText = pontosAtuais;
            await updateDoc(refJogador, { acertos: pontosAtuais });
            await addDoc(collection(db, "salas", salaPIN, "respostas"), {
                nick, personagem: meuSprite, pergunta: enunciadoAtual, acertou: isCorrect, timestamp: new Date().toISOString()
            });

            setTimeout(() => { fb.innerText = ""; renderQuestion(); }, 2000);
        }
    </script>
</body>
</html>
