<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ARENA PRO - LIVE RACE COM BOSS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffe16d", "secondary": "#cfbcff", "error": "#ffb4ab",
                        "surface": "#131315", "background": "#131315", "on-surface-variant": "#d0c6ab"
                    },
                    "fontFamily": { "headline-md": ["Sora"], "body-lg": ["Sora"], "label-sm": ["Sora"], "label-lg": ["Sora"], "display-lg": ["Sora"], "body-md": ["Sora"] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #0a0a0c; overflow: hidden; color: #e5e1e4; }
        
        .glass-panel { background: rgba(14, 14, 16, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-accent { background: rgba(98, 0, 234, 0.15); backdrop-filter: blur(20px); border: 1px solid rgba(179, 136, 255, 0.3); }
        .gold-glow { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        
        .finish-line { background: repeating-linear-gradient(45deg, #ffd700, #ffd700 10px, #000 10px, #000 20px); opacity: 0.5; }
        .lane-border { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        @keyframes pulse-gold { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-gold { animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .arena-bg-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .theme-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 2s ease-in-out; pointer-events: none; }
        .theme-layer.active { opacity: 1; }
        .theme-overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 12, 0.7) 100%); z-index: 10; }

        .bg-galaxy { background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); }
        .stars { position: absolute; width: 100%; height: 100%; background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat; animation: stars-move 100s linear infinite; }
        @keyframes stars-move { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }

        .bg-forest { background: linear-gradient(180deg, #051605 0%, #0a2410 100%); }
        .spores { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(76, 175, 80, 0.1) 0%, transparent 70%); animation: drift 20s ease-in-out infinite alternate; }
        @keyframes drift { from { transform: translateY(0) scale(1); } to { transform: translateY(-50px) scale(1.1); } }

        .bg-medieval { background: linear-gradient(to bottom, #1a0f00 0%, #3d2b1f 100%); }
        .dramatic-sky { position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, #ff6b0011 0%, transparent 40%); filter: blur(60px); animation: sky-pulse 8s infinite alternate; }
        @keyframes sky-pulse { from { opacity: 0.2; } to { opacity: 0.5; } }

        .bg-cyber { background: #050505; }
        .grid-lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(98, 0, 234, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(98, 0, 234, 0.05) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(60deg) translateY(-100px); transform-origin: top; animation: grid-move 5s linear infinite; }
        @keyframes grid-move { from { background-position: 0 0; } to { background-position: 0 50px; } }
        .neon-pulse { position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #6200ea, transparent); top: 20%; animation: neon-sweep 4s linear infinite; }
        @keyframes neon-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; z-index: 3001; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
        
        #alerta-chegada { position: fixed; top: 15%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 3px solid #ffd700; color: white; font-size: 24px; font-weight: bold; padding: 15px 30px; border-radius: 20px; z-index: 2000; display: none; text-align: center; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5); animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: translate(-50%, -100%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        /* Ajuste de escala para comportar superpopulação */
        .player-lane { height: 3.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; position: relative; }
        .mover-wrapper { display: flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 9999px; transition: transform 0.7s ease-out; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }

        /* =========================================
           SISTEMA DE PUNIÇÃO DO ROBÔ E ANIMAÇÕES
           ========================================= */
        #guardian-robot { position: absolute; right: 5%; top: 10%; z-index: 50; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        
        .patrolling { animation: patrol 8s ease-in-out infinite alternate; }
        @keyframes patrol { 0% { top: 5%; } 50% { top: 75%; } 100% { top: 20%; } }

        .robot-wrapper { transform: scale(0.35); transform-origin: right center; position: relative; }
        .robot-container { position: relative; width: 150px; height: 160px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        .robot-ear { position: absolute; top: 40px; width: 15px; height: 35px; background: #94a3b8; border: 4px solid #1e293b; }
        .ear-left { left: 12px; border-radius: 10px 0 0 10px; border-right: 0; }
        .ear-right { right: 12px; border-radius: 0 10px 10px 0; border-left: 0; }

        .robot-head { position: absolute; top: 0; left: 25px; width: 100px; height: 85px; background: #1e293b; border-radius: 45px 45px 25px 25px; border: 5px solid #ef4444; z-index: 10; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);}
        .robot-visor { position: absolute; top: 25px; left: 10px; width: 70px; height: 35px; background: #000; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; overflow: hidden; border: 2px solid #ef4444;}
        
        .robot-eye { width: 18px; height: 8px; background: #ef4444; border-radius: 4px; animation: blink 4s infinite; box-shadow: 0 0 10px #ef4444; transform: rotate(15deg); }
        .robot-eye:last-child { transform: rotate(-15deg); }
        @keyframes blink { 0%, 94%, 98% { transform: scaleY(1) rotate(15deg); } 96%, 100% { transform: scaleY(0.1) rotate(15deg); } }

        .robot-arm { position: absolute; top: 90px; width: 25px; height: 60px; background: #1e293b; border-radius: 15px; border: 5px solid #ef4444; z-index: 1; }
        .arm-left { left: 15px; transform: rotate(30deg); transform-origin: top center; animation: swing-l 1s infinite;}
        .arm-right { right: 15px; transform: rotate(-30deg); transform-origin: top center; animation: swing-r 1s infinite;}
        @keyframes swing-l { 0%, 100% { transform: rotate(30deg); } 50% { transform: rotate(50deg); } }
        @keyframes swing-r { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(-50deg); } }

        .robot-body { position: absolute; top: 75px; left: 35px; width: 80px; height: 75px; background: #1e293b; border-radius: 20px 20px 35px 35px; border: 5px solid #ef4444; z-index: 5; display: flex; justify-content: center; }
        .robot-core { margin-top: 25px; width: 25px; height: 25px; background: #ef4444; border-radius: 50%; border: 4px solid #000; animation: pulse-core 1s infinite; }
        @keyframes pulse-core { 0%, 100% { transform: scale(1); box-shadow: 0 0 10px #ef4444; } 50% { transform: scale(1.3); box-shadow: 0 0 30px #ef4444; } }

        .kick-anim { transform: scale(0.4) rotate(-25deg) translateX(-50px) !important; }
        .explosion { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #fff, #ffd700, #ef4444, transparent); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 100; transform: translate(-50%, -50%) scale(0); }
        .explode-anim { animation: boom 0.5s ease-out forwards; }
        @keyframes boom { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0); } 50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.5); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2); } }

        .spin-hit { animation: get-hit 0.8s cubic-bezier(0.5, 0, 0.1, 1) forwards; }
        @keyframes get-hit { 
            0% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 20px red) hue-rotate(90deg) brightness(2); } 
            50% { transform: rotate(-360deg) scale(0.5); filter: drop-shadow(0 0 40px red) hue-rotate(90deg) brightness(3); } 
            100% { transform: rotate(-720deg) scale(1); filter: none; } 
        }
    </style>
</head>
<body class="bg-transparent text-white min-h-screen flex flex-col">

    <audio id="som-ponto" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

    <div id="alerta-chegada">🎉 <span id="nome-chegada"></span> CRUZOU A LINHA DE CHEGADA! 🎉</div>

            <div class="flex items-end gap-8 h-[500px]">
                <div class="flex flex-col items-center gap-6 w-64 transition-all duration-1000 transform translate-y-10 opacity-0" id="lugar-2">

                    <div class="w-full h-64 glass-panel rounded-t-2xl flex flex-col items-center pt-8 border-slate-400/30"><span class="text-slate-400 text-5xl font-bold">#2</span><p class="text-2xl text-white mt-4 font-bold truncate w-full text-center px-2" id="p2-name">---</p></div>
                </div>
                <div class="flex flex-col items-center gap-6 w-80 transition-all duration-1000 transform translate-y-10 opacity-0" id="lugar-1">
                    <span class="material-symbols-outlined text-primary-fixed text-6xl animate-bounce" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                    <div class="w-48 h-48 rounded-full border-8 border-primary-fixed glass-panel overflow-hidden shadow-[0_0_40px_rgba(255,215,0,0.6)] flex items-center justify-center bg-gray-900" id="avatar-1"></div>
                    <div class="w-full h-80 glass-accent rounded-t-3xl flex flex-col items-center pt-10 border-primary-fixed/50 gold-glow"><span class="text-primary-fixed text-6xl font-bold">#1</span><p class="text-3xl text-white mt-4 uppercase tracking-wider truncate w-full text-center px-4 font-bold" id="p1-name">---</p></div>
                </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtKHigv0ghzwzMilQ1y0NTebpmaI2yE2A",
            authDomain: "yvypoty-491e8.firebaseapp.com",
            projectId: "yvypoty-491e8",
            storageBucket: "yvypoty-491e8.firebasestorage.app",
            messagingSenderId: "338156073833",
            appId: "1:338156073833:web:ca0d8ede1456dad29243f8",
            measurementId: "G-W93E7TJ59V"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const salaPIN = localStorage.getItem("salaPIN");
        if(!salaPIN) { alert("Erro de conexão."); window.location.href = "index.html"; }
        document.getElementById('pin-gigante').innerText = salaPIN;

        window.robotBusy = false; // Controle para evitar ataques simultâneos do robô

        function updateTheme() {
            let activeTheme = localStorage.getItem("temaAtivo") || 'cyber';
            const themeMap = {
                'tema-corrida': 'cyber', 'tema-scifi': 'galaxy', 
                'tema-pixel': 'medieval', 'tema-inca': 'forest', 'tema-dino': 'forest',
                'galaxy': 'galaxy', 'forest': 'forest', 'medieval': 'medieval', 'cyber': 'cyber'
            };
            const mappedTheme = themeMap[activeTheme] || 'cyber';
            
            ['galaxy', 'forest', 'medieval', 'cyber'].forEach(t => {
                const el = document.getElementById(`theme-${t}`);
                if (el) { t === mappedTheme ? el.classList.add('active') : el.classList.remove('active'); }
            });
        }
        updateTheme();
        window.addEventListener('storage', (e) => { if (e.key === 'temaAtivo') updateTheme(); });

        document.body.addEventListener('click', () => { document.getElementById("som-ponto").load(); }, { once: true });

        const players = {};
        const META_PONTOS = 12;
        let vencedores = []; 
        let podioExibido = false;

        onSnapshot(doc(db, "salas", salaPIN, "configuracao", "estado"), (docSnap) => {
            const dados = docSnap.data();
            const overlay = document.getElementById('overlay-espera');
            
            if (dados && dados.jogando === true) {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => { overlay.classList.add('hidden'); }, 700);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => { overlay.classList.remove('opacity-0', 'pointer-events-none'); }, 50);
            }
        });

        onSnapshot(doc(db, "salas", salaPIN), (docSnap) => {
            const dados = docSnap.data();
            if (dados && dados.encerrada === true) {
                document.body.innerHTML = '<div class="flex items-center justify-center h-screen bg-black text-white text-5xl uppercase tracking-widest text-[#ffd700] font-bold">AULA ENCERRADA PELO PROFESSOR</div>';
                setTimeout(() => { window.location.href = "index.html"; }, 5000);
            }
        });

        function processarAvatar(icone) {
            if(icone.includes('/') || icone.includes('http')) return `<img class="w-full h-full object-contain" src="${icone}">`;
            return `<span class="text-xl">${icone}</span>`;
        }

        function mostrarAlertaCruzamento(nome) {
            document.getElementById('nome-chegada').innerText = nome.toUpperCase();
            document.getElementById('alerta-chegada').style.display = 'block';
            setTimeout(() => { document.getElementById('alerta-chegada').style.display = 'none'; }, 2200);
        }

        function exibirPodioFinal() {
            if(podioExibido) return;
            podioExibido = true;
            const screen = document.getElementById('podium-screen');
            screen.classList.remove('opacity-0', 'pointer-events-none');
            screen.classList.add('opacity-100');
            
            if(vencedores[0]) { document.getElementById('p1-name').innerText = vencedores[0].nome; document.getElementById('avatar-1').innerHTML = processarAvatar(vencedores[0].icone); setTimeout(() => { document.getElementById('lugar-1').classList.remove('translate-y-10', 'opacity-0'); }, 500); }
            if(vencedores[1]) { document.getElementById('p2-name').innerText = vencedores[1].nome; document.getElementById('avatar-2').innerHTML = processarAvatar(vencedores[1].icone); setTimeout(() => { document.getElementById('lugar-2').classList.remove('translate-y-10', 'opacity-0'); }, 1000); }
            if(vencedores[2]) { document.getElementById('p3-name').innerText = vencedores[2].nome; document.getElementById('avatar-3').innerHTML = processarAvatar(vencedores[2].icone); setTimeout(() => { document.getElementById('lugar-3').classList.remove('translate-y-10', 'opacity-0'); }, 1500); }
            
            const cores = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffd700'];
            for(let i = 0; i < 150; i++) {
                let confete = document.createElement('div');
                confete.className = 'confetti';
                confete.style.left = Math.random() * 100 + 'vw';
                confete.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
                confete.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.getElementById('podium-screen').appendChild(confete);
            }
        }

        function atualizarRanking(listaDocs) {
            let ranking = [];
            listaDocs.forEach(d => ranking.push({ nome: d.id, pontos: d.data().acertos || 0 }));
            ranking.sort((a,b) => b.pontos - a.pontos);
            
            document.getElementById('ranking-list').innerHTML = ranking.slice(0, 8).map((p, index) => `
                <div class="flex items-center gap-2 p-1.5 ${index === 0 ? 'glass-accent border-[#ffd700]/30' : 'glass-panel border-white/5'} rounded-lg">
                    <div class="w-5 h-5 flex shrink-0 items-center justify-center text-[10px] font-bold ${index < 3 ? 'text-[#ffd700]' : 'text-gray-400'} bg-black/40 rounded">${index + 1}</div>
                    <div class="flex-grow min-w-0"><p class="text-xs font-bold text-white truncate w-full">${p.nome}</p></div>
                </div>
            `).join("");
        }

        onSnapshot(collection(db, "salas", salaPIN, "jogadores"), (snapshot) => {
            document.getElementById("player-count").innerText = snapshot.docs.length;
            document.getElementById("contador-espera").innerText = snapshot.docs.length;
            atualizarRanking(snapshot.docs);
            
            snapshot.docChanges().forEach((change) => {
                const dados = change.doc.data();
                const nome = change.doc.id;
                let acertos = dados.acertos || 0;
                let icone = dados.sprite || "⏳";

                if(change.type === "removed") { location.reload(); return; }

                if (!players[nome]) {
                    const lane = document.createElement('div');
                    lane.id = `lane-${nome}`;
                    lane.className = 'player-lane relative w-full group z-10 shrink-0';
                    
                    lane.innerHTML = `
                        <div id="mover-${nome}" class="mover-wrapper glass-panel border-white/10 group-hover:border-primary-fixed/40" style="transform: translateX(0%);">
                            <div class="w-9 h-9 rounded-full border border-[#ffd700] overflow-hidden bg-gray-900 flex items-center justify-center shrink-0 shadow-md" id="avatar-container-${nome}">
                                ${processarAvatar(icone)}
                            </div>
                            <div class="flex flex-col min-w-0 pr-2">
                                <span class="font-bold text-xs text-white truncate max-w-[100px] leading-tight">${nome}</span>
                                <span class="text-[10px] text-[#ffd700] font-bold"><span id="score-${nome}">0</span>/12</span>
                            </div>
                        </div>
                    `;
                    document.getElementById('race-container').appendChild(lane);
                    players[nome] = { nome: nome, icone: icone, terminou: false, pontosAntigos: 0, alertado: false };
                } else {
                    document.getElementById(`avatar-container-${nome}`).innerHTML = processarAvatar(icone);
                    players[nome].icone = icone;
                }

                const moverElement = document.getElementById(`mover-${nome}`);
                document.getElementById(`score-${nome}`).innerText = acertos;
                
                let posPercent = (acertos / 11) * 90;
                if (acertos >= 12) posPercent = 94;
                moverElement.style.transform = `translateX(${posPercent}vw)`;

                // ALERTA DE CRUZAMENTO
                if (acertos === 11 && !players[nome].alertado) {
                    players[nome].alertado = true;
                    mostrarAlertaCruzamento(nome);
                }

                // DETECÇÃO DE ACERTO
                if(acertos > players[nome].pontosAntigos && acertos > 0) {
                    const avatarBg = document.getElementById(`avatar-container-${nome}`);
                    avatarBg.classList.add("gold-glow");
                    const som = document.getElementById("som-ponto");
                    som.currentTime = 0; som.play().catch(e => {});
                    setTimeout(() => avatarBg.classList.remove("gold-glow"), 800);
                } 
                // DETECÇÃO DE ERRO (PUNIÇÃO DO ROBÔ BOSS)
                else if (acertos < players[nome].pontosAntigos) {
                    const avatarBg = document.getElementById(`avatar-container-${nome}`);
                    avatarBg.classList.add("spin-hit");
                    setTimeout(() => avatarBg.classList.remove("spin-hit"), 800);

                    if (!window.robotBusy) {
                        window.robotBusy = true;
                        const robot = document.getElementById('guardian-robot');
                        const robotBody = document.getElementById('robot-body-wrapper');
                        const explosion = document.getElementById('explosion-effect');
                        const arenaRect = document.getElementById('arena').getBoundingClientRect();
                        const playerRect = moverElement.getBoundingClientRect();

                        // O robô mira as coordenadas do jogador dentro da arena
                        const topPos = playerRect.top - arenaRect.top - 50; 
                        const rightPos = arenaRect.right - playerRect.right - 80;

                        robot.classList.remove('patrolling');
                        robot.style.top = `${topPos}px`;
                        robot.style.right = `${rightPos}px`;

                        // Temporizador do ataque do Boss
                        setTimeout(() => {
                            robotBody.classList.add('kick-anim');
                            
                            // Explosão exatamente na colisão
                            explosion.style.left = `${playerRect.right - arenaRect.left}px`;
                            explosion.style.top = `${playerRect.top - arenaRect.top + (playerRect.height/2)}px`;
                            explosion.classList.remove('explode-anim');
                            void explosion.offsetWidth; // Força recálculo do CSS
                            explosion.classList.add('explode-anim');

                            // Retorno do Boss à base
                            setTimeout(() => {
                                robotBody.classList.remove('kick-anim');
                                robot.style.top = '10%';
                                robot.style.right = '5%';
                                
                                setTimeout(() => {
                                    robot.classList.add('patrolling');
                                    window.robotBusy = false;
                                }, 400);
                            }, 500);
                        }, 400);
                    }
                }
                players[nome].pontosAntigos = acertos;

                // VITÓRIA OFICIAL
                if (acertos >= META_PONTOS && !players[nome].terminou) {
                    players[nome].terminou = true;
                    vencedores.push({ nome: nome, icone: icone });
                    document.getElementById("som-vitoria").play().catch(e => {});
                    document.getElementById(`avatar-container-${nome}`).classList.add('gold-glow', 'animate-pulse-gold');

                    if (vencedores.length === 3 || vencedores.length === snapshot.docs.length) { 
                        setTimeout(() => { exibirPodioFinal(); }, 2500); 
                    }
                }
            });
        });
    </script>
</body>
</html>
