<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ARENA PRO - LIVE RACE</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary-fixed": "#ffe16d", "secondary": "#cfbcff", "error": "#ffb4ab", "surface": "#131315", "background": "#131315" } } } }
    </script>
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #0a0a0c; overflow: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-accent { background: rgba(98, 0, 234, 0.1); backdrop-filter: blur(40px); border: 1px solid rgba(179, 136, 255, 0.3); }
        .gold-glow { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        .finish-line { background: repeating-linear-gradient(45deg, #ffd700, #ffd700 10px, #000 10px, #000 20px); opacity: 0.8; }
        .lane-border { border-bottom: 1px solid rgba(179, 136, 255, 0.15); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        @keyframes pulse-gold { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-gold { animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.5); border-radius: 4px; }

        .tema-corrida { background: linear-gradient(to right, #1e293b, #0f172a); }
        .tema-pixel { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><text x='20' y='280' font-size='120'>🍄</text><text x='150' y='100' font-size='60'>☁️</text></svg>"), linear-gradient(to right, #5c94fc, #87b4ff); }
        .tema-gelo { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><text x='50' y='280' font-size='150'>🏔️</text><text x='250' y='280' font-size='100'>⛄</text></svg>"), linear-gradient(to right, #a1c4fd, #c2e9fb); }
        .tema-dragao { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='300'><text x='20' y='280' font-size='180'>🏰</text><text x='300' y='150' font-size='100'>🐉</text></svg>"), linear-gradient(to right, #2b1055, #7597de); }
        .tema-inca { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><text x='50' y='280' font-size='180'>🛕</text><text x='250' y='280' font-size='100'>🌴</text></svg>"), linear-gradient(to right, #11998e, #38ef7d); }

        .confetti { position: absolute; width: 10px; height: 10px; animation: fall linear forwards; z-index: 3001; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
        
        #alerta-chegada { position: fixed; top: 15%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 3px solid #ffd700; color: white; font-size: 24px; font-weight: bold; padding: 15px 30px; border-radius: 20px; z-index: 2000; display: none; text-align: center; box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5); animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: translate(-50%, -100%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-background text-white h-screen flex flex-col">

    <audio id="som-ponto" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
    <audio id="som-vitoria" src="https://actions.google.com/sounds/v1/crowds/cheer.ogg"></audio>
    <div id="alerta-chegada">🎉 <span id="nome-chegada"></span> CRUZOU A LINHA! 🎉</div>

    <!-- CORTINA DE ESPERA GIGANTE (NOVO) -->
    <div id="overlay-espera" class="fixed inset-0 z-[60] bg-black/85 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-700">
        <h2 class="text-5xl text-white font-bold mb-6 tracking-widest uppercase">ENTRE NA ARENA COM O PIN:</h2>
        <div class="text-[150px] font-black text-[#ffd700] tracking-widest drop-shadow-[0_0_50px_rgba(255,215,0,0.8)] leading-none mb-8" id="pin-gigante">---</div>
        
        <div class="flex items-center gap-4 bg-white/10 px-8 py-4 rounded-full border border-white/20">
            <span class="material-symbols-outlined text-4xl text-secondary animate-pulse">group</span>
            <span class="text-3xl font-bold"><span id="contador-espera">0</span> GUERREIROS CONECTADOS</span>
        </div>
        <p class="text-2xl text-gray-400 mt-12 animate-pulse">Aguardando o professor iniciar a batalha...</p>
    </div>

    <!-- Top HUD Bar -->
    <header class="w-full fixed top-0 left-0 z-50 px-4 py-2 flex justify-between items-center bg-transparent backdrop-blur-md border-b border-white/10">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold uppercase tracking-tighter text-primary-fixed drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]">ARENA PRO</h1>
            <div class="h-6 w-px bg-white/20"></div>
            <div class="flex items-center gap-2 px-3 py-1 glass-panel rounded-full border-primary-fixed/30">
                <span class="material-symbols-outlined text-primary-fixed text-sm">flag</span>
                <span class="text-sm font-bold uppercase tracking-widest text-primary-fixed" id="titulo-sala">PIN: ---</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-4 py-1 glass-panel rounded-2xl border-secondary/30">
                <span class="material-symbols-outlined text-secondary text-sm">group</span>
                <div class="flex items-center gap-2">
                    <span class="text-lg font-bold leading-none text-white" id="player-count">0</span>
                    <span class="text-[10px] font-bold uppercase text-secondary/70">Guerreiros</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow pt-16 pb-4 px-4 flex gap-4 h-full overflow-hidden">
        <aside class="w-56 flex flex-col h-full gap-2 z-10">
            <div class="glass-panel rounded-2xl p-4 flex flex-col h-full overflow-hidden border-primary-fixed/20">
                <div class="flex items-center gap-2 mb-4 justify-center">
                    <span class="material-symbols-outlined text-primary-fixed text-sm" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                    <h2 class="text-sm font-bold text-primary-fixed uppercase italic">Ranking</h2>
                </div>
                <div class="flex flex-col gap-2 overflow-y-auto pr-1" id="ranking-list"></div>
            </div>
        </aside>

        <section class="flex-grow relative glass-panel rounded-2xl overflow-hidden border-white/5 shadow-2xl" id="arena">
            <div class="absolute top-0 bottom-0 left-[90%] w-8 finish-line opacity-30 z-0"></div>
            <div class="absolute top-0 bottom-0 left-[90%] w-1 bg-primary-fixed/50 z-10 shadow-[0_0_20px_rgba(255,215,0,0.8)]"></div>
            <div class="absolute top-8 left-[91%] z-20">
                <span class="text-xl font-bold text-primary-fixed uppercase italic opacity-80 [writing-mode:vertical-lr] tracking-widest drop-shadow-md">Chegada</span>
            </div>
            
            <div class="relative w-full h-full p-4 flex flex-col gap-3 overflow-y-auto" id="race-container">
                <div class="absolute inset-0 grid grid-cols-10 pointer-events-none opacity-20 z-0">
                    <div class="border-r border-white/30 h-full"></div><div class="border-r border-white/30 h-full"></div>
                    <div class="border-r border-white/30 h-full"></div><div class="border-r border-white/30 h-full"></div>
                    <div class="border-r border-white/30 h-full"></div><div class="border-r border-white/30 h-full"></div>
                    <div class="border-r border-white/30 h-full"></div><div class="border-r border-white/30 h-full"></div>
                    <div class="border-r border-white/30 h-full"></div><div class="border-r border-white/30 h-full"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Podium Screen (Top 3) Mantido -->
    <div class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000" id="podium-screen">
        <div class="relative z-10 flex flex-col items-center gap-12 w-full max-w-6xl px-12">
            <h2 class="text-6xl text-[#ffd700] font-bold uppercase italic tracking-tighter drop-shadow-[0_0_30px_rgba(255,215,0,0.6)]">VENCEDORES DA ARENA</h2>
            <div class="flex items-end gap-8 h-[500px]">
                <div class="flex flex-col items-center gap-6 w-64 transition-all duration-1000 transform translate-y-10 opacity-0" id="lugar-2">
                    <div class="w-32 h-32 rounded-full border-4 border-slate-400 glass-panel overflow-hidden shadow-[0_0_20px_rgba(148,163,184,0.4)] flex items-center justify-center bg-gray-900" id="avatar-2"></div>
                    <div class="w-full h-64 glass-panel rounded-t-2xl flex flex-col items-center pt-8"><span class="text-slate-400 text-5xl font-bold">#2</span><p class="text-2xl text-white mt-4 font-bold" id="p2-name">---</p></div>
                </div>
                <div class="flex flex-col items-center gap-6 w-80 transition-all duration-1000 transform translate-y-10 opacity-0" id="lugar-1">
                    <span class="material-symbols-outlined text-[#ffd700] text-6xl animate-bounce" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                    <div class="w-48 h-48 rounded-full border-8 border-[#ffd700] glass-panel overflow-hidden shadow-[0_0_40px_rgba(255,215,0,0.6)] flex items-center justify-center bg-gray-900" id="avatar-1"></div>
                    <div class="w-full h-80 glass-accent rounded-t-3xl flex flex-col items-center pt-10 border-[#ffd700]/50 gold-glow"><span class="text-[#ffd700] text-6xl font-bold">#1</span><p class="text-3xl text-white mt-4 font-bold" id="p1-name">---</p></div>
                </div>
                <div class="flex flex-col items-center gap-6 w-64 transition-all duration-1000 transform translate-y-10 opacity-0" id="lugar-3">
                    <div class="w-32 h-32 rounded-full border-4 border-amber-700 glass-panel overflow-hidden shadow-[0_0_20px_rgba(180,83,9,0.4)] flex items-center justify-center bg-gray-900" id="avatar-3"></div>
                    <div class="w-full h-48 glass-panel rounded-t-2xl flex flex-col items-center pt-8"><span class="text-amber-700 text-5xl font-bold">#3</span><p class="text-2xl text-white mt-4 font-bold" id="p3-name">---</p></div>
                </div>
            </div>
            <button class="mt-8 px-12 py-4 bg-[#ffd700] text-black font-bold uppercase tracking-widest hover:translate-y-[-4px] transition-transform active:scale-95" onclick="window.location.reload()">Reiniciar Arena</button>
        </div>
    </div>

    <!-- LOGICA FIREBASE E UI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAtKHigv0ghzwzMilQ1y0NTebpmaI2yE2A",
    authDomain: "yvypoty-491e8.firebaseapp.com",
    projectId: "yvypoty-491e8",
    storageBucket: "yvypoty-491e8.firebasestorage.app",
    messagingSenderId: "338156073833",
    appId: "1:338156073833:web:ca0d8ede1456dad29243f8",
    measurementId: "G-W93E7TJ59V" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const salaPIN = localStorage.getItem("salaPIN");
        const tema = localStorage.getItem("temaAtivo") || "tema-corrida";
        
        if(!salaPIN) { alert("Erro de conexão."); window.location.href = "index.html"; }

        document.getElementById('titulo-sala').innerText = `PIN: ${salaPIN}`;
        document.getElementById('pin-gigante').innerText = salaPIN;
        document.getElementById('arena').className = `flex-grow relative glass-panel rounded-2xl overflow-hidden border-white/5 shadow-2xl ${tema}`;

        document.body.addEventListener('click', () => { document.getElementById("som-ponto").load(); }, { once: true });

        const players = {};
        const META_PONTOS = 10; 
        let vencedores = []; 
        let podioExibido = false;

        // --- LÓGICA DE CONTROLE DA TELA DE ESPERA E ENCERRAMENTO ---
        onSnapshot(doc(db, "salas", salaPIN, "configuracao", "estado"), (docSnap) => {
            const dados = docSnap.data();
            const overlay = document.getElementById('overlay-espera');
            if (dados && dados.jogando === true) {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 700);
            } else {
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.opacity = '1', 50);
            }
        });

        onSnapshot(doc(db, "salas", salaPIN), (docSnap) => {
            const dados = docSnap.data();
            if (dados && dados.encerrada === true) {
                document.body.innerHTML = '<div class="flex items-center justify-center h-screen bg-black text-white text-5xl uppercase tracking-widest text-[#ffd700] font-bold">AULA ENCERRADA PELO PROFESSOR</div>';
                setTimeout(() => { window.location.href = "index.html"; }, 5000);
            }
        });

        // --- FUNÇÕES AUXILIARES ---
        function processarAvatar(icone) {
            if(icone.includes('/') || icone.includes('http')) return `<img class="w-full h-full object-contain" src="${icone}">`;
            return `<span class="text-4xl">${icone}</span>`;
        }

        function mostrarAlertaCruzamento(nome) {
            document.getElementById('nome-chegada').innerText = nome.toUpperCase();
            document.getElementById('alerta-chegada').style.display = 'block';
            setTimeout(() => { document.getElementById('alerta-chegada').style.display = 'none'; }, 2000);
        }

        function exibirPodioFinal() {
            if(podioExibido) return;
            podioExibido = true;
            document.getElementById('podium-screen').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('podium-screen').classList.add('opacity-100');
            
            if(vencedores[0]) { document.getElementById('p1-name').innerText = vencedores[0].nome; document.getElementById('avatar-1').innerHTML = processarAvatar(vencedores[0].icone); setTimeout(() => { document.getElementById('lugar-1').classList.remove('translate-y-10', 'opacity-0'); }, 500); }
            if(vencedores[1]) { document.getElementById('p2-name').innerText = vencedores[1].nome; document.getElementById('avatar-2').innerHTML = processarAvatar(vencedores[1].icone); setTimeout(() => { document.getElementById('lugar-2').classList.remove('translate-y-10', 'opacity-0'); }, 1000); }
            if(vencedores[2]) { document.getElementById('p3-name').innerText = vencedores[2].nome; document.getElementById('avatar-3').innerHTML = processarAvatar(vencedores[2].icone); setTimeout(() => { document.getElementById('lugar-3').classList.remove('translate-y-10', 'opacity-0'); }, 1500); }
        }

        function atualizarRanking(listaDocs) {
            let ranking = [];
            listaDocs.forEach(d => ranking.push({ nome: d.id, pontos: d.data().acertos || 0 }));
            ranking.sort((a,b) => b.pontos - a.pontos);
            
            document.getElementById('ranking-list').innerHTML = ranking.slice(0, 8).map((p, index) => `
                <div class="flex items-center gap-3 p-2 ${index === 0 ? 'glass-accent border-[#ffd700]/30' : 'glass-panel border-white/5'} rounded-lg">
                    <div class="w-6 h-6 flex items-center justify-center text-xs font-bold ${index < 3 ? 'text-[#ffd700]' : 'text-gray-400'} bg-black/40 rounded">${index + 1}</div>
                    <div class="flex-grow"><p class="text-sm font-bold text-white truncate max-w-[100px]">${p.nome}</p></div>
                </div>
            `).join("");
        }

        // --- MOTOR PRINCIPAL DA CORRIDA ---
        onSnapshot(collection(db, "salas", salaPIN, "jogadores"), (snapshot) => {
            const total = snapshot.docs.length;
            document.getElementById("player-count").innerText = total;
            document.getElementById("contador-espera").innerText = total; // Atualiza contador gigante
            atualizarRanking(snapshot.docs);
            
            snapshot.docChanges().forEach((change) => {
                const dados = change.doc.data(); const nome = change.doc.id;
                let acertos = dados.acertos || 0; let icone = dados.sprite || "⏳";

                if(change.type === "removed") { location.reload(); return; }

                if (!players[nome]) {
                    const lane = document.createElement('div');
                    lane.id = `lane-${nome}`;
                    lane.className = 'player-lane relative h-20 w-full flex items-center lane-border group z-10 shrink-0';
                    
                    lane.innerHTML = `
                        <div id="mover-${nome}" class="absolute left-0 transition-transform duration-700 ease-out flex items-center gap-4 px-4 py-2 rounded-full glass-panel border-white/10" style="transform: translateX(0%);">
                            <div class="w-16 h-16 rounded-full border-2 border-[#ffd700] overflow-hidden bg-gray-900 flex items-center justify-center" id="avatar-container-${nome}">
                                ${processarAvatar(icone)}
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-xl text-white truncate max-w-[180px] drop-shadow-md">${nome}</span>
                                <span class="text-sm text-[#ffd700] font-bold bg-black/50 px-2 py-0.5 rounded-full w-min mt-1"><span id="score-${nome}">0</span>pts</span>
                            </div>
                        </div>
                    `;
                    document.getElementById('race-container').appendChild(lane);
                    players[nome] = { nome: nome, icone: icone, terminou: false, pontosAntigos: 0 };
                } else {
                    document.getElementById(`avatar-container-${nome}`).innerHTML = processarAvatar(icone);
                    players[nome].icone = icone;
                }

                const moverElement = document.getElementById(`mover-${nome}`);
                document.getElementById(`score-${nome}`).innerText = acertos;
                
                let posPercent = (acertos / META_PONTOS) * 90;
                if (posPercent > 90) posPercent = 90; 
                moverElement.style.transform = `translateX(${posPercent}vw)`;

                if(acertos > players[nome].pontosAntigos && acertos > 0) {
                    const avatarBg = document.getElementById(`avatar-container-${nome}`);
                    avatarBg.classList.add("gold-glow");
                    document.getElementById("som-ponto").play().catch(e => {});
                    setTimeout(() => avatarBg.classList.remove("gold-glow"), 800);
                }
                players[nome].pontosAntigos = acertos;

                if (acertos >= META_PONTOS && !players[nome].terminou) {
                    players[nome].terminou = true;
                    vencedores.push({ nome: nome, icone: icone });
                    mostrarAlertaCruzamento(nome);
                    document.getElementById("som-vitoria").play().catch(e => {});
                    document.getElementById(`avatar-container-${nome}`).classList.add('gold-glow', 'animate-pulse-gold');

                    if (vencedores.length === 3 || vencedores.length === total) { 
                        setTimeout(() => { exibirPodioFinal(); }, 2500); 
                    }
                }
            });
        });
    </script>
</body>
</html>
